<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>프로토타입 002 — 3D 탄종 조합</title>
    <style>
      :root {
        --hud-fg: #eaeef2;
        --hud-dim: #8b95a3;
        --accent: #ffb648;
        --hp: #ff4d5e;
        --mag: #6fd0ff;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0c10; }
      #app { position: fixed; inset: 0; }
      canvas { display: block; }

      /* ---- HUD (DOM overlay) ---- */
      #hud {
        position: fixed; inset: 0; pointer-events: none;
        font-family: "Segoe UI", system-ui, sans-serif;
        color: var(--hud-fg); user-select: none;
        text-shadow: 0 1px 3px rgba(0,0,0,0.8);
      }
      #hud .panel { position: absolute; }

      /* bottom-left cluster */
      #hud-bottomleft { left: 22px; bottom: 20px; width: 320px; }

      .hpbar-wrap {
        width: 260px; height: 20px; border-radius: 4px;
        background: rgba(0,0,0,0.45); border: 1px solid rgba(255,255,255,0.12);
        overflow: hidden; margin-bottom: 8px; position: relative;
      }
      .hpbar-fill { height: 100%; background: linear-gradient(90deg,#ff2e44,#ff6d7c); width: 100%; transition: width 0.12s linear; }
      .hpbar-text { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
        font-size: 12px; font-weight: 600; letter-spacing: 0.5px; }

      .gunrow { display: flex; gap: 8px; margin-bottom: 8px; }
      .gunchip {
        padding: 5px 12px; border-radius: 5px; font-size: 13px; font-weight: 600;
        background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.10); color: var(--hud-dim);
      }
      .gunchip.active { background: rgba(255,182,72,0.18); border-color: var(--accent); color: var(--accent); }

      .mag { display: flex; gap: 3px; margin-bottom: 4px; }
      .mag .cell { width: 12px; height: 20px; border-radius: 2px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12); }
      .mag .cell.loaded { background: var(--mag); border-color: var(--mag); box-shadow: 0 0 6px rgba(111,208,255,0.5); }
      .reloading { color: var(--accent); font-size: 12px; font-weight: 600; height: 16px; }

      /* skills */
      #hud-skills { left: 22px; bottom: 132px; width: 420px; }
      .skill { margin-bottom: 10px; }
      .skill .head { display: flex; align-items: center; gap: 8px; }
      .skill .key {
        display: inline-flex; align-items: center; justify-content: center;
        width: 24px; height: 24px; border-radius: 4px; font-weight: 700; font-size: 13px;
        background: rgba(255,255,255,0.10); border: 1px solid rgba(255,255,255,0.18);
      }
      .skill.q .key { color: #ff9a52; }
      .skill.e .key { color: #b7c6ff; }
      .skill .charges { display: flex; gap: 4px; }
      .skill .charge { width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,0.12); }
      .skill.q .charge.on { background: #ff7a3c; box-shadow: 0 0 6px rgba(255,122,60,0.7); }
      .skill.e .charge.on { background: #7f9bff; box-shadow: 0 0 6px rgba(127,155,255,0.7); }
      .skill .desc { font-size: 12px; color: var(--hud-dim); margin-top: 3px; line-height: 1.35; }
      .skill .desc b { color: var(--hud-fg); font-weight: 600; }

      /* top-right stats */
      #hud-topright { right: 22px; top: 18px; text-align: right; }
      #hud-topright .wave { font-size: 26px; font-weight: 800; letter-spacing: 0.5px; }
      #hud-topright .sub { font-size: 13px; color: var(--hud-dim); margin-top: 2px; }
      #hud-topright .kills { font-size: 13px; color: var(--hud-dim); }

      /* dash cd bottom-center */
      #hud-dash { left: 50%; bottom: 24px; transform: translateX(-50%); text-align: center; }
      .dash-track { width: 120px; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.10); overflow: hidden; }
      .dash-fill { height: 100%; width: 100%; background: #7ee0c0; transition: width 0.05s linear; }
      .dash-label { font-size: 11px; color: var(--hud-dim); margin-top: 4px; letter-spacing: 1px; }
      .dash-fill.ready { background: #7ee0c0; }
      .dash-fill.cooling { background: #4a5a6a; }

      /* controls hint / banner */
      #hud-hint { left: 50%; top: 16px; transform: translateX(-50%); font-size: 12px; color: var(--hud-dim); }
      #banner { position: absolute; left: 50%; top: 42%; transform: translate(-50%,-50%); text-align: center;
        font-size: 40px; font-weight: 800; color: #fff; opacity: 0; transition: opacity 0.3s; }
      #banner.show { opacity: 1; }
      #banner .small { display:block; font-size: 15px; color: var(--hud-dim); font-weight: 500; margin-top: 6px; }
    </style>
